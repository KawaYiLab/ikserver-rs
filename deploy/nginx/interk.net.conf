# 主站：页面由 Nuxt 渲染，/v1 同源反代到 ik-server（ADR 0002）。

server {
    listen 80;
    listen [::]:80;
    server_name interk.net www.interk.net;
    return 301 https://interk.net$request_uri;
}

server {
    # nginx ≥ 1.25.1 可改写成 `listen 443 ssl;` + `http2 on;`（旧写法在新版本只会给出警告）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.interk.net;
    ssl_certificate     /etc/ssl/interk.net/fullchain.pem;
    ssl_certificate_key /etc/ssl/interk.net/privkey.pem;
    return 301 https://interk.net$request_uri;
}

server {
    # nginx ≥ 1.25.1 可改写成 `listen 443 ssl;` + `http2 on;`（旧写法在新版本只会给出警告）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name interk.net;
    ssl_certificate     /etc/ssl/interk.net/fullchain.pem;
    ssl_certificate_key /etc/ssl/interk.net/privkey.pem;

    include /etc/nginx/snippets/ik-api.inc;

    # 主站 Nuxt（SSR）。它在服务端请求接口时直连 http://127.0.0.1:8080/v1，
    # 转发 Cookie 与收到的 X-Forwarded-For（见 ADR 0002）。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
