# 后端域名：安卓 App 的接口地址，以及 /admin 管理后台（同源调用 /v1）。

server {
    listen 80;
    listen [::]:80;
    server_name ik.tiwat.cn;
    return 301 https://ik.tiwat.cn$request_uri;
}

server {
    # nginx ≥ 1.25.1 可改写成 `listen 443 ssl;` + `http2 on;`（旧写法在新版本只会给出警告）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ik.tiwat.cn;
    ssl_certificate     /etc/ssl/ik.tiwat.cn/fullchain.pem;
    ssl_certificate_key /etc/ssl/ik.tiwat.cn/privkey.pem;

    include /etc/nginx/snippets/ik-api.inc;

    # 管理后台：admin/ 下 `pnpm build` 的产物（.output/public）发布到这里。
    # 纯 SPA：预渲染的路由是 <路由>/index.html，其余路径回退到 200.html（交给前端路由）。
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /srv/interknot/admin/;
        try_files $uri $uri/index.html /admin/200.html;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # 带哈希的静态资源长期缓存，入口页不缓存（发版后立刻生效）。
        location /admin/_nuxt/ {
            alias /srv/interknot/admin/_nuxt/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location = /admin/200.html {
        alias /srv/interknot/admin/200.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location = / {
        return 302 https://interk.net/;
    }
}
