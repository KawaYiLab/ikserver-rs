# 后端域名：安卓 App 的接口地址，以及 /admin 管理后台（同源调用 /v1）。

server {
    listen 80;
    listen [::]:80;
    server_name ik.tiwat.cn;
    return 301 https://ik.tiwat.cn$request_uri;
}

server {
    # nginx ≥ 1.25.1 可改写成 `listen 443 ssl;` + `http2 on;`（旧写法在新版本只会给出警告）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ik.tiwat.cn;
    ssl_certificate     /etc/ssl/ik.tiwat.cn/fullchain.pem;
    ssl_certificate_key /etc/ssl/ik.tiwat.cn/privkey.pem;

    include /etc/nginx/snippets/ik-api.inc;

    # 管理后台：页面编进了 ik-server（缓存头、安全头和前端路由回退都由它处理），这里只转发。
    location /admin {
        proxy_pass http://ik_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 https://interk.net/;
    }
}
