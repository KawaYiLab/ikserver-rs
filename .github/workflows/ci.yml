name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  RUST_VERSION: "1.99.0"
  SQLX_VERSION: "0.9.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ik
          POSTGRES_PASSWORD: ik
          POSTGRES_DB: ik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 搜索引擎用例（crates/search/tests）连它；没有它时这些用例直接通过。
      meilisearch:
        image: getmeili/meilisearch:v1.55
        env:
          MEILI_MASTER_KEY: ci-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    env:
      DATABASE_URL: postgres://ik:ik@localhost:5432/ik
      IK_TEST_MEILI_URL: http://localhost:7700
      IK_TEST_MEILI_KEY: ci-master-key-0123456789
      IK_TEST_S3_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # 媒体上传用例（crates/media/tests）连它。用 moto 模拟 S3，和本机开发一致
      # （Docker Hub 上的 minio/minio 镜像已经拉不到了）。
      - name: Start S3 mock (moto)
        run: |
          pipx install 'moto[server]==5.2.4'
          moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && break; sleep 1; done
          curl -sS -o /dev/null -w "moto %{http_code}\n" http://localhost:9000
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ${{ env.SQLX_VERSION }} --no-default-features --features postgres --locked
      # 用服务自己的 migrate：除了 migrations/，还会建好 graphile_worker 的表（测试里有查询
      # 直接读 graphile_worker.jobs，编译期检查需要它）。此时库还是空的，所以用 .sqlx 缓存离线编译。
      - name: Apply migrations
        run: cargo run -q -p ik-server --locked -- migrate
        env:
          SQLX_OFFLINE: "true"
      # .sqlx/ 必须与迁移后的真实库一致；忘了 `cargo sqlx prepare` 会在这里失败。
      - name: Check .sqlx offline cache
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=warn
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: OpenAPI document builds
        run: cargo run -q -p ik-server --locked -- openapi > openapi.json
      # 管理后台的接口类型从 admin/openapi.json 生成；后端改了接口要一起更新。
      - name: Admin OpenAPI snapshot is current
        run: diff -u admin/openapi.json openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match admin/openapi.json
        run: pnpm gen:api && git diff --exit-code app/types/api.d.ts
      - run: pnpm typecheck
      - run: pnpm build
