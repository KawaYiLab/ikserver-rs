name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  RUST_VERSION: "1.99.0"
  SQLX_VERSION: "0.9.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ik
          POSTGRES_PASSWORD: ik
          POSTGRES_DB: ik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 搜索引擎用例（crates/search/tests）连它；没有它时这些用例直接通过。
      meilisearch:
        image: getmeili/meilisearch:v1.55
        env:
          MEILI_MASTER_KEY: ci-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    env:
      DATABASE_URL: postgres://ik:ik@localhost:5432/ik
      IK_TEST_MEILI_URL: http://localhost:7700
      IK_TEST_MEILI_KEY: ci-master-key-0123456789
      IK_TEST_S3_URL: http://localhost:9000
      IK_TEST_S3_ACCESS_KEY: ikminio
      IK_TEST_S3_SECRET_KEY: ikminio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # 媒体上传用例（crates/media/tests）连它。服务容器不能传启动参数，所以用 docker run。
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ikminio -e MINIO_ROOT_PASSWORD=ikminio-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ${{ env.SQLX_VERSION }} --no-default-features --features postgres --locked
      - name: Apply migrations
        run: cargo sqlx migrate run
      # .sqlx/ 必须与迁移后的真实库一致；忘了 `cargo sqlx prepare` 会在这里失败。
      - name: Check .sqlx offline cache
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Tests
        run: cargo nextest run --workspace --locked --no-tests=warn
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: OpenAPI document builds
        run: cargo run -q -p ik-server --locked -- openapi > openapi.json
      # 管理后台的接口类型从 admin/openapi.json 生成；后端改了接口要一起更新。
      - name: Admin OpenAPI snapshot is current
        run: diff -u admin/openapi.json openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match admin/openapi.json
        run: pnpm gen:api && git diff --exit-code app/types/api.d.ts
      - run: pnpm typecheck
      - run: pnpm build
