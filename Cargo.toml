[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# 内部 crate
ik-kernel = { path = "crates/kernel" }
ik-auth = { path = "crates/auth" }
ik-content = { path = "crates/content" }
ik-comments = { path = "crates/comments" }
ik-economy = { path = "crates/economy" }
ik-exam = { path = "crates/exam" }
ik-social = { path = "crates/social" }
ik-notify = { path = "crates/notify" }
ik-messaging = { path = "crates/messaging" }
ik-realtime = { path = "crates/realtime" }
ik-profile = { path = "crates/profile" }
ik-feed = { path = "crates/feed" }
ik-search = { path = "crates/search" }
ik-media = { path = "crates/media" }
ik-cosmetics = { path = "crates/cosmetics" }
ik-mihoyo = { path = "crates/mihoyo" }
ik-account = { path = "crates/account" }
ik-moderation = { path = "crates/moderation" }
ik-ai = { path = "crates/ai" }
ik-admin = { path = "crates/admin" }
ik-legacy = { path = "crates/legacy" }
ik-mail = { path = "crates/mail" }
ik-story = { path = "crates/story" }

# 异步运行时与 Web
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "timeout", "limit", "compression-gzip", "compression-br", "catch-panic", "set-header", "sensitive-headers", "csrf"] }
http = "1.5"
http-body-util = "0.1"
futures-util = "0.3"
# 管理后台静态文件编进可执行文件（发布构建嵌入，调试构建读磁盘）
rust-embed = { version = "8.13", features = ["mime-guess"] }
async-trait = "0.1"

# 数据库（不启用 TLS：本机与生产都走本地/内网连接，避免引入 C 依赖）
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI
utoipa = { version = "6", features = ["chrono"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# 错误
thiserror = "2"
anyhow = "1"

# 时间
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"

# 配置与命令行
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"
clap = { version = "4.6", features = ["derive"] }

# 密码学
argon2 = "0.6"
bcrypt = "0.19"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64 = "0.23"
subtle = "2.6"

# 搜索（内网 HTTP，不启用 TLS）
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest"] }

# 对象存储（R2 / 七牛 S3 兼容）。TLS 用 rustls + ring，不引入 aws-lc 的 CMake 依赖。
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["rt-tokio", "http-1x", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# 图片解码（只为算 ThumbHash；纯 Rust 解码器，AVIF 不解）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
thumbhash = "0.1"

# 后台任务（PostgreSQL 队列）。不启用 TLS，与 sqlx 一致。
graphile_worker = { version = "0.14", default-features = false, features = ["runtime-tokio", "driver-sqlx"] }

# SMTP 发信（rustls + ring，与其他 TLS 一致，不引入 aws-lc / OpenSSL）
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls", "rustls-tls"] }
# 调用米游社等外部 HTTPS 接口（rustls + ring，与对象存储一致，不引入 aws-lc）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# 大模型：OpenAI 兼容协议。byot 用自己的类型解析流（思考增量、工具调用等各家扩展字段）。
# TLS 不用它默认的 aws-lc，由 ik-ai 用 ring 构造 reqwest 客户端交给它。
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "byot", "rustls-no-provider"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# 剧情库（ik-story）：语料包解压、文档 id 哈希与子串扫描
flate2 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memchr = "2.7"
arc-swap = "1.7"

# 其他
moka = { version = "0.12", features = ["future"] }
governor = "0.10"
validator = { version = "0.21", features = ["derive"] }
unicode-normalization = "0.1"
regex = "1"
parking_lot = "0.12"

# 测试
insta = { version = "1", features = ["json"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.sqlx-macros]
opt-level = 3

# 密码哈希在未优化构建下慢一个数量级，会拖慢本地登录与测试。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
