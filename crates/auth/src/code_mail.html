<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>%TITLE% - 绳网</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    :root {
      color-scheme: dark;
      supported-color-schemes: dark;
    }
    body, table, td, p, a, span {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#09090b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <!-- Preheader Text (Visible in email client preview snippet) -->
  <div style="display:none;font-size:1px;color:#09090b;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">
    您的%HEADING%是 %CODE%（%MINUTES% 分钟内有效）。如非本人操作请忽略。
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#09090b;width:100%;">
    <tr>
      <td align="center" style="padding:56px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;width:100%;">
          <!-- Brand Header -->
          <tr>
            <td style="padding-bottom:32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td valign="middle" style="padding-right:10px;">
                    <img src="https://im.tiwat.cn/zzzicon_200x200.png" alt="绳网" width="26" height="26" style="display:block;border-radius:6px;border:1px solid #27272a;outline:none;" />
                  </td>
                  <td valign="middle">
                    <span style="font-size:14px;font-weight:600;letter-spacing:0.04em;color:#e4e4e7;">绳网</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Heading & Description -->
          <tr>
            <td style="padding-bottom:24px;">
              <h1 style="margin:0 0 10px 0;font-size:20px;font-weight:600;letter-spacing:-0.02em;color:#fafafa;line-height:1.3;">%HEADING%</h1>
              <p style="margin:0;font-size:14px;color:#a1a1aa;line-height:1.6;">%DESCRIPTION%</p>
            </td>
          </tr>

          <!-- Code Display (Linear/Apple-like Monospace Focus) -->
          <tr>
            <td align="center" style="padding:16px 0 14px 0;">
              <div style="display:inline-block;padding:12px 28px;background-color:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08);border-radius:8px;">
                <span style="font-family:ui-monospace,'Cascadia Code','Source Code Pro',Menlo,Consolas,'Liberation Mono',monospace;font-size:36px;font-weight:700;letter-spacing:10px;text-indent:10px;color:#ffffff;display:inline-block;line-height:1;user-select:all;-webkit-user-select:all;">%CODE%</span>
              </div>
            </td>
          </tr>

          <!-- Expiration & Security Note -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <p style="margin:0;font-size:12px;color:#71717a;line-height:1.5;">
                验证码有效期 <span style="color:#a1a1aa;font-weight:500;">%MINUTES% 分钟</span> · 请勿泄露给任何人
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="height:1px;background-color:#1f1f23;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer Notes -->
          <tr>
            <td style="padding-top:24px;">
              <p style="margin:0 0 16px 0;font-size:12px;color:#71717a;line-height:1.7;">
                %FOOTER%
              </p>
              <p style="margin:0;font-size:12px;color:#52525b;line-height:1.5;">
                &copy; %YEAR% 绳网
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
